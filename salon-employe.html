<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#198754"><title>GURISHA — Mon espace salon</title>
<style>
:root{--g:#198754;--gd:#126b42;--gl:#e8f5ed;--bg:#f4f8f5;--bd:#dce7df;--tx:#26372d;--muted:#718078}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,sans-serif}header{background:var(--g);color:white;text-align:center;padding:18px}header h1{margin:0;letter-spacing:2px}main{max-width:850px;margin:auto;padding:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.green{background:var(--g);color:white}.light{background:var(--gl);color:var(--gd)}.panel,.item{background:#fff;border:1px solid var(--bd);border-radius:13px;padding:14px;margin-bottom:12px}.panel h3{margin:0 0 12px;color:var(--gd)}.muted{font-size:12px;color:var(--muted);line-height:1.5}.row{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.member{padding:9px 0;border-bottom:1px solid #edf1ee}.member:last-child{border:0}.status{display:inline-block;border-radius:20px;padding:5px 9px;background:var(--gl);color:var(--gd);font-size:11px;font-weight:700}.notice{padding:11px;border-radius:9px;background:var(--gl);color:var(--gd);font-size:13px;margin:10px 0}.notice.error{background:#fdebed;color:#a52b35}.item strong{color:var(--gd)}.item small{display:block;color:var(--muted);margin-top:5px}.item button{margin-top:10px;width:100%}
</style></head><body><header><h1>GURISHA</h1><p>Mon espace de travail — Salon</p></header><main>
<div class="top"><div><h2 style="margin:0;color:var(--gd)">Bonjour <span id="employeeName">…</span></h2><small id="shopLabel" class="muted">Chargement…</small></div><button class="light" onclick="location.href='index.html'">← Accueil</button></div>
<div id="notice" class="notice" hidden></div>
<section class="panel"><h3>Mon équipe</h3><div id="teamInfo" class="muted">Chargement…</div></section>
<section class="panel"><h3>Mes rendez-vous et prestations</h3><div id="appointmentList" class="muted">Chargement…</div></section>
<section class="panel"><h3>Mes déplacements</h3><div id="transportList" class="muted">Chargement…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
let db,shopId,userId,profile,appointments=[],transports=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(msg,error=false){$('notice').hidden=false;$('notice').textContent=msg;$('notice').className='notice'+(error?' error':'');}
function labelStatus(s){return ({pending:'En attente de confirmation',confirmed:'Confirmé',in_progress:'En cours',completed:'Terminé',cancelled:'Annulé'})[s]||s;}
async function load(){
 const {data:assignments,error:ae}=await db.from('salon_appointment_staff').select('appointment_id,assignment_label').eq('shop_id',shopId).eq('staff_profile_id',profile.id);
 if(ae)throw ae;
 const ids=(assignments||[]).map(x=>x.appointment_id);
 if(!ids.length){appointments=[];transports=[];$('appointmentList').textContent='Aucun rendez-vous ne vous est attribué pour le moment.';$('transportList').textContent='Aucun déplacement prévu.';}
 else{
  const [ar,tr]=await Promise.all([
   db.from('salon_appointments').select('*').in('id',ids).order('appointment_date').order('start_time'),
   db.from('salon_transport_bookings').select('*').in('appointment_id',ids).order('pickup_at')
  ]);
  if(ar.error)throw ar.error;if(tr.error)throw tr.error;appointments=ar.data||[];transports=tr.data||[];
  $('appointmentList').innerHTML=appointments.map(a=>'<article class="item"><div class="row"><strong>'+esc(a.service_name)+' · '+esc(a.client_name)+'</strong><span class="status">'+esc(labelStatus(a.appointment_status))+'</span></div><small>'+a.appointment_date+' à '+String(a.start_time).slice(0,5)+' · '+(a.location_mode==='home'?'À domicile':'Au salon')+'</small>'+(a.client_phone?'<small>Téléphone : '+esc(a.client_phone)+'</small>':'')+(a.client_address?'<small>Adresse : '+esc(a.client_address)+'</small>':'')+'<small>Votre rôle : '+esc(assignments.find(x=>x.appointment_id===a.id)?.assignment_label||'Équipe')+'</small>'+(a.appointment_status==='confirmed'?'<button class="green" data-status="'+a.id+'" data-next="in_progress">Commencer la prestation</button>':a.appointment_status==='in_progress'?'<button class="green" data-status="'+a.id+'" data-next="completed">Confirmer la fin</button>':'')+'</article>').join('')||'Aucun rendez-vous.';
  $('transportList').innerHTML=transports.map(t=>{const a=appointments.find(x=>x.id===t.appointment_id);return '<article class="item"><strong>Taxi — '+esc(a?.client_name||'Cliente')+'</strong><small>Départ : '+esc(t.pickup_address)+'</small><small>Destination : '+esc(t.destination_address)+'</small><small>Heure prévue : '+new Date(t.pickup_at).toLocaleString('fr-FR')+'</small><small>Réservation : '+esc(t.booking_status)+'</small>'+(t.taxi_provider?'<small>Taxi : '+esc(t.taxi_provider)+'</small>':'')+'</article>';}).join('')||'Aucun taxi prévu pour vos rendez-vous.';
 }
 document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',async()=>{
  b.disabled=true;const {error}=await db.rpc('gurisha_salon_update_appointment_status',{p_appointment_id:b.dataset.status,p_status:b.dataset.next});
  if(error){say(error.message,true);b.disabled=false;return;}say(b.dataset.next==='in_progress'?'Prestation commencée.':'Prestation terminée.');await load();
 }));
}
(async()=>{
 try{
  db=window.supabase.createClient(window.GURISHA_SUPABASE_URL,window.GURISHA_SUPABASE_KEY);
  const {data:{session},error}=await db.auth.getSession();if(error||!session){location.replace('connexion.html');return;}userId=session.user.id;
  const roles=Array.isArray(session.user.user_metadata?.gurisha_roles)?session.user.user_metadata.gurisha_roles:[];
  if(!roles.some(r=>['hairdresser','beautician'].includes(r)))throw new Error('Cet espace est réservé aux coiffeurs et esthéticiennes.');
  const {data:members,error:me}=await db.from('shop_members').select('shop_id,role').eq('user_id',userId);if(me)throw me;
  const key='gurisha_active_shop_'+userId,saved=localStorage.getItem(key),member=(members||[]).find(m=>m.shop_id===saved)||members?.[0];if(!member)throw new Error('Aucun établissement associé à ce compte.');shopId=member.shop_id;
  const {data:p,error:pe}=await db.from('staff_profiles').select('id,display_name,roles').eq('shop_id',shopId).eq('user_id',userId).maybeSingle();if(pe)throw pe;if(!p)throw new Error('Profil employé introuvable.');profile=p;
  $('employeeName').textContent=profile.display_name;
  const {data:shop}=await db.from('shops').select('name').eq('id',shopId).maybeSingle();$('shopLabel').textContent=shop?.name||'Mon salon';
  const {data:teamLinks,error:te}=await db.from('salon_team_members').select('team_id,team_function').eq('shop_id',shopId).eq('staff_profile_id',profile.id);if(te)throw te;
  if(teamLinks?.length){
   const ids=teamLinks.map(x=>x.team_id);const [teams,links]=await Promise.all([db.from('salon_teams').select('*').in('id',ids),db.from('salon_team_members').select('team_id,staff_profile_id,team_function').in('team_id',ids)]);
   if(teams.error)throw teams.error;if(links.error)throw links.error;
   const staffIds=[...new Set((links.data||[]).map(x=>x.staff_profile_id))];
   const {data:profiles,error:se}=await db.from('staff_profiles').select('id,display_name').in('id',staffIds);if(se)throw se;
   $('teamInfo').innerHTML=(teams.data||[]).map(t=>'<div class="member"><strong>'+esc(t.team_name)+'</strong><small>Chef : '+esc(profiles.find(p=>p.id===t.team_leader_id)?.display_name||'Non désigné')+'</small><small>Collègues : '+(links.data||[]).filter(x=>x.team_id===t.id).map(x=>esc(profiles.find(p=>p.id===x.staff_profile_id)?.display_name||'Employé')).join(', ')+'</small></div>').join('');
  }else $('teamInfo').textContent='Vous n’êtes pas encore affecté à une équipe permanente.';
  await load();
 }catch(e){say(e.message||'Impossible de charger votre espace.',true);}
})();
</script></body></html>
