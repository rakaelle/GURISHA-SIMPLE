<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#198754">
<title>GURISHA — Fast-Food</title>
<style>
:root{--g:#198754;--gd:#126b42;--gl:#e8f5ed;--bg:#f4f8f5;--bd:#dce7df;--tx:#26372d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,sans-serif}
header{background:var(--g);color:#fff;text-align:center;padding:20px 14px}header h1{margin:0;letter-spacing:2px}header p{margin:6px 0 0;font-size:13px}
main{max-width:900px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
h2{margin:0;color:var(--gd);font-size:20px}small{color:#718078}
button,a{font-family:inherit}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 16px;border:1px solid #cfe2d6;border-radius:11px;background:#f1f8f3;color:#285b3c;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--g);border-color:var(--g);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:9px;padding:17px;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 3px 12px rgba(20,70,45,.04)}
.card .emoji{font-size:27px}.card h3{margin:0;color:var(--gd);font-size:16px}.card p{margin:0 0 5px;color:#718078;font-size:12px;line-height:1.5}.card .btn{margin-top:auto}
@media(max-width:600px){main{padding:12px}.top{align-items:flex-start}.grid{grid-template-columns:1fr}}

.ff-toolbar{display:flex;flex-wrap:nowrap;gap:8px;margin:0 auto 15px;padding:3px 12px 11px;max-width:1100px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#c9dfd1 transparent}.ff-toolbar::-webkit-scrollbar{height:5px}.ff-toolbar::-webkit-scrollbar-thumb{background:#c9dfd1;border-radius:10px}.ff-toolbar a{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:39px;padding:9px 15px;border:1px solid #cfe2d6;border-radius:20px;background:#fff;color:#285b3c;font-size:12px;font-weight:800;text-decoration:none}.ff-toolbar a.active{background:#198754;border-color:#198754;color:#fff}.ff-toolbar a.shop-link{background:#e8f5ed;color:#126b42}@media(max-width:600px){.ff-toolbar{gap:7px;padding-left:10px;padding-right:10px}.ff-toolbar a{padding:9px 13px}}
</style>
</head>
<body>
<header><h1>GURISHA</h1><p>Espace Fast-Food</p></header>
<nav class="ff-toolbar" aria-label="Navigation Fast-Food">
<a href="fast-food-caisse.html">CAISSE</a><a href="fast-food-menu.html">MENUS</a><a href="fast-food-stock.html">STOCK</a><a href="preparateur.html">PRÉPARATION</a>
<a class="shop-link" href="index.html">🏪 BOUTIQUE</a>
</nav>
<main>
<div class="top"><div><h2>Gestion Fast-Food</h2><small>Utilise les onglets ci-dessus pour passer d’une rubrique à l’autre.</small></div></div>
<section class="card"><h3>Bienvenue dans l’espace Fast-Food</h3><p>Choisis Caisse, Menus, Stock ou Préparation dans la barre horizontale.</p></section>
</main>
</body>
</html>
